{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Tea – Bill Reports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #0d6efd;
            --primary-dark: #0b5ed7;
            --success: #198754;
            --danger: #dc3545;
            --warning: #ffc107;
            --dark: #212529;
            --light: #f4f6f9;
            --white: #ffffff;
            --border: #dee2e6;
            --text: #333333;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--light);
            color: var(--text);
        }

        /* ================= HEADER ================= */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            padding: 24px;
            box-shadow: var(--shadow-lg);
            border-bottom: 2px solid var(--primary);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--white);
            color: var(--primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        /* ================= CONTAINER ================= */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }


        /* ================= STATS ================= */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
        }

        .stat-card h3 {
            margin: 0 0 8px;
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }

        /* ================= BILLS TABLE ================= */
        .bills-section {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .bills-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bills-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--text);
        }

        .bills-table {
            width: 100%;
            border-collapse: collapse;
        }

        .bills-table thead {
            background: var(--light);
        }

        .bills-table th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
            border-bottom: 2px solid var(--border);
        }

        .bills-table td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .bills-table tbody tr {
            transition: background 0.2s ease;
        }

        .bills-table tbody tr:hover {
            background: var(--light);
        }

        .bill-id {
            font-weight: 600;
            color: var(--primary);
        }

        .bill-total {
            font-weight: 700;
            color: var(--success);
            font-size: 16px;
        }

        .bill-date {
            color: #666;
            font-size: 13px;
        }

        .bill-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .action-view {
            background: var(--primary);
            color: var(--white);
        }

        .action-view:hover {
            background: var(--primary-dark);
        }

        .action-print {
            background: var(--success);
            color: var(--white);
        }

        .action-print:hover {
            background: #0d6d39;
        }

        .action-delete {
            background: var(--danger);
            color: var(--white);
        }

        .action-delete:hover {
            background: #c82333;
        }

        /* ================= MODAL ================= */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: 12px;
            padding: 28px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--primary);
        }

        .modal-close {
            background: var(--light);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--border);
            transform: rotate(90deg);
        }

        .bill-details {
            margin-bottom: 20px;
        }

        .bill-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed var(--border);
        }

        .bill-detail-label {
            color: #666;
            font-weight: 500;
        }

        .bill-detail-value {
            font-weight: 600;
            color: var(--text);
        }

        .bill-items {
            background: var(--light);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .bill-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .bill-item:last-child {
            border-bottom: none;
        }

        .bill-item-name {
            font-weight: 600;
        }

        .bill-item-total {
            color: var(--success);
            font-weight: 700;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-modal-print {
            background: var(--success);
            color: var(--white);
        }

        .btn-modal-print:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(25, 135, 84, 0.4);
        }

        .btn-modal-close {
            background: #6c757d;
            color: var(--white);
        }

        .btn-modal-close:hover {
            background: #5a6268;
        }

        /* ================= EMPTY STATE ================= */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 16px;
            margin: 0;
        }

        /* ================= PAGINATION ================= */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
            padding: 20px;
        }

        .pagination button,
        .pagination a {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--white);
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .pagination button:hover,
        .pagination a:hover {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        .pagination .active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        /* ================= PRINT STYLES ================= */
        @media print {
            .header-actions,
            .stats,
            .bills-header,
            .action-btn,
            .pagination {
                display: none !important;
            }

            .header {
                background: var(--white);
                color: var(--text);
                border: 2px solid var(--border);
            }

            .bills-table {
                width: 100%;
            }

            .bills-table td,
            .bills-table th {
                border: 1px solid var(--border);
            }
        }

        /* ================= MOBILE RESPONSIVE ================= */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 22px;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions button,
            .header-actions a {
                flex: 1;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .bills-table {
                font-size: 12px;
            }

            .bills-table th,
            .bills-table td {
                padding: 12px 8px;
            }

            .bill-actions {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
                justify-content: center;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
            }

            .modal-actions {
                flex-direction: column;
            }

            .modal-actions button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<!-- ================= HEADER ================= -->
<div class="header">
    <div class="header-content">
        <h1><i class="fas fa-chart-bar"></i> Bill Reports</h1>
        <div class="header-actions">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-plus"></i> New Bill
            </a>
            <button class="btn btn-danger" onclick="exportToCSV()">
                <i class="fas fa-download"></i> Export CSV
            </button>
        </div>
    </div>
</div>

<!-- ================= CONTAINER ================= -->
<div class="container">
    <!-- ================= STATS ================= -->
    <div class="stats">
        <div class="stat-card">
            <h3>Total Bills</h3>
            <div class="value" id="totalBills">0</div>
        </div>
        <div class="stat-card">
            <h3>Total Revenue</h3>
            <div class="value">₹<span id="totalRevenue">0</span></div>
        </div>
        <div class="stat-card">
            <h3>Average Bill</h3>
            <div class="value">₹<span id="averageBill">0</span></div>
        </div>
        <div class="stat-card">
            <h3>Highest Bill</h3>
            <div class="value">₹<span id="highestBill">0</span></div>
        </div>
    </div>

    <!-- ================= BILLS TABLE ================= -->
    <div class="bills-section">
        <div class="bills-header">
            <h2><i class="fas fa-receipt"></i> All Bills</h2>
        </div>

        <table class="bills-table" id="billsTable">
            <thead>
                <tr>
                    <th>Bill ID</th>
                    <th>Date & Time</th>
                    <th>Items</th>
                    <th>Total Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="billsTableBody">
                <tr>
                    <td colspan="5" style="text-align: center; padding: 40px;">
                        <i class="fas fa-spinner fa-spin"></i> Loading bills...
                    </td>
                </tr>
            </tbody>
        </table>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div><i class="fas fa-inbox"></i></div>
            <p>No bills found</p>
        </div>
    </div>

    <!-- ================= PAGINATION ================= -->
    <div class="pagination" id="pagination"></div>
</div>

<!-- ================= BILL DETAIL MODAL ================= -->
<div class="modal" id="billModal">
    <div class="modal-content">
        <div class="modal-header">
            <span>Bill Details</span>
            <button class="modal-close" onclick="closeBillModal()">×</button>
        </div>

        <div class="bill-details" id="billDetailsContent">
            <!-- Bill details will be populated here -->
        </div>

        <div class="modal-actions">
            <button class="btn-modal-print" onclick="printBill()">
                <i class="fas fa-print"></i> Print
            </button>
            <button class="btn-modal-close" onclick="closeBillModal()">
                Close
            </button>
        </div>
    </div>
</div>

<script>

let allBills = [];
let currentBillDetails = null;
const itemsPerPage = 10;
let currentPage = 1;


// ================= LOAD BILLS =================
function loadBills() {
    fetch('/get-bills/')
    .then(res => res.json())
    .then(data => {

        if (data.status === 'success') {
            allBills = data.bills || [];

            renderTable();
            updateStats();
        }

    })
    .catch(error => {
        console.error(error);
        showError('Failed to load bills');
    });
}


// ================= RENDER TABLE =================
function renderTable() {

    const tbody = document.getElementById('billsTableBody');

    if (allBills.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="5" style="text-align:center;">
                    No Bills Found
                </td>
            </tr>
        `;
        return;
    }

    tbody.innerHTML = allBills.map(bill => `
        <tr>
            <td>#${bill.id}</td>
            <td>
                ${bill.date}<br>
                <small>${bill.time}</small>
            </td>
            <td>${bill.items.length}</td>
            <td class="bill-total">₹${bill.total_amount}</td>
            <td>
                <div class="bill-actions">
                    <button class="action-btn action-view"
                        onclick="viewBillDetails(${bill.id})">
                        View
                    </button>

                    <button class="action-btn action-print"
                        onclick="printSpecificBill(${bill.id})">
                        Print
                    </button>

                    <button class="action-btn action-delete"
                        onclick="deleteBill(${bill.id})">
                        Delete
                    </button>
                </div>
            </td>
        </tr>
    `).join('');
}


// ================= UPDATE STATS =================
function updateStats() {

    document.getElementById('totalBills').innerText =
        allBills.length;

    const revenue =
        allBills.reduce((sum, bill) =>
            sum + Number(bill.total_amount), 0);

    document.getElementById('totalRevenue').innerText =
        revenue.toFixed(2);

    document.getElementById('averageBill').innerText =
        allBills.length
            ? (revenue / allBills.length).toFixed(2)
            : '0';

    document.getElementById('highestBill').innerText =
        allBills.length
            ? Math.max(...allBills.map(b => Number(b.total_amount)))
            : '0';
}


// ================= VIEW BILL =================
function viewBillDetails(billId) {

    const bill = allBills.find(b => b.id === billId);

    if (!bill) return;

    currentBillDetails = bill;

    const itemsHtml = bill.items.map(item => `
        <div class="bill-item">
            <span>
                ${item.product_name}
                × ${item.quantity}
            </span>

            <span>
                ₹${item.total}
            </span>
        </div>
    `).join('');

    document.getElementById('billDetailsContent').innerHTML = `
        <div class="bill-detail-row">
            <span>Bill ID</span>
            <span>#${bill.id}</span>
        </div>

        <div class="bill-detail-row">
            <span>Date</span>
            <span>${bill.date}</span>
        </div>

        <div class="bill-detail-row">
            <span>Time</span>
            <span>${bill.time}</span>
        </div>

        <div class="bill-items">
            ${itemsHtml}
        </div>

        <div class="bill-detail-row">
            <strong>Total Amount</strong>
            <strong>₹${bill.total_amount}</strong>
        </div>
    `;

    document.getElementById('billModal').classList.add('show');
}


// ================= CLOSE MODAL =================
function closeBillModal() {
    document.getElementById('billModal').classList.remove('show');
}


// ================= PRINT BILL =================
function printBill() {

    if (!currentBillDetails) return;

    window.print();
}


function printSpecificBill(id) {

    viewBillDetails(id);

    setTimeout(() => {
        printBill();
    }, 100);
}


// ================= DELETE BILL =================
function deleteBill(billId) {

    if (!confirm('Delete this bill?')) {
        return;
    }

    fetch(`/delete-bill/${billId}/`, {
        method: 'DELETE',
        headers: {
            'X-CSRFToken': getCSRFToken()
        }
    })
    .then(res => res.json())
    .then(data => {

        if (data.status === 'success') {

            allBills =
                allBills.filter(b => b.id !== billId);

            renderTable();
            updateStats();

            showSuccess('Bill deleted');
        }

    })
    .catch(error => {
        console.error(error);
        showError('Delete failed');
    });
}


// ================= EXPORT CSV =================
function exportToCSV() {

    let csv =
        'Bill ID,Date,Time,Items,Total Amount\n';

    allBills.forEach(bill => {

        csv += `${bill.id},"${bill.date}","${bill.time}",${bill.items.length},${bill.total_amount}\n`;

    });

    const link =
        document.createElement('a');

    link.href =
        'data:text/csv;charset=utf-8,' +
        encodeURIComponent(csv);

    link.download =
        'bill_report.csv';

    link.click();
}


// ================= HELPERS =================
function getCSRFToken() {

    return document.cookie
        .split('; ')
        .find(row => row.startsWith('csrftoken='))
        ?.split('=')[1];
}


function showError(message) {
    alert(message);
}


function showSuccess(message) {
    alert(message);
}


// ================= OUTSIDE CLICK =================
document.addEventListener('click', function(e) {

    const modal =
        document.getElementById('billModal');

    if (e.target === modal) {
        closeBillModal();
    }

});


// ================= START =================
loadBills();

</script>

</body>
</html>
